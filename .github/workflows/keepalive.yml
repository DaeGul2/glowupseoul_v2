name: Keep Render awake

# Render 무료 인스턴스는 15분 유휴 시 sleep → 첫 방문자가 30~50초 대기.
# 10분마다 핑을 날려 항상 깨어있게 유지 (무료 750h/월 내에서 서비스 1개는 상시 가동 가능).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS -m 30 https://glowupseoul.onrender.com/healthz \
            || curl -fsS -m 30 https://glowupseoul.onrender.com/api/health \
            || echo "::warning::ping failed — service may be waking up"
