name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 0) 소스 체크아웃 — diff 비교에 히스토리 필요
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1) 변경 경로 감지 — 불필요한 npm ci / build 스킵
      - name: Detect changed paths
        id: diff
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # 첫 push / 수동 실행 → 전체 빌드
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "client_changed=true" >> $GITHUB_OUTPUT
            echo "server_changed=true" >> $GITHUB_OUTPUT
            echo "deploy_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git fetch --no-tags --depth=200 origin $BEFORE || true
          git fetch --no-tags --depth=200 origin $AFTER  || true

          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" || true)"
          echo "Changed between $BEFORE..$AFTER:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^client/'; then
            echo "client_changed=true" >> $GITHUB_OUTPUT
          else
            echo "client_changed=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -qE '^server/'; then
            echo "server_changed=true" >> $GITHUB_OUTPUT
          else
            echo "server_changed=false" >> $GITHUB_OUTPUT
          fi
          # nginx config / deploy script 변경 시 nginx reload 까지
          if echo "$CHANGED" | grep -qE '^deploy/'; then
            echo "deploy_changed=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_changed=false" >> $GITHUB_OUTPUT
          fi

      # 2) 클라이언트 빌드 — EC2 가 아니라 Actions 러너에서 (작은 인스턴스 보호).
      #    VITE_* 값은 빌드에 박히므로 secret 에서 주입.
      - name: Setup Node
        if: steps.diff.outputs.client_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client
        if: steps.diff.outputs.client_changed == 'true'
        run: |
          set -e
          cd client
          npm ci --no-audit --no-fund
          if [ -n "${{ secrets.VITE_TURNSTILE_SITE_KEY }}" ]; then
            echo "VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}" > .env
          else
            echo "::warning::VITE_TURNSTILE_SITE_KEY secret not set — booking Turnstile widget will be skipped"
          fi
          npm run build
          tar -czf ../client-dist.tgz -C dist .

      - name: Upload dist to EC2
        if: steps.diff.outputs.client_changed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: client-dist.tgz
          target: /home/ubuntu/

      # 3) EC2 SSH 진입 → .env 주입 + git pull + deploy script 실행
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          request_pty: true
          command_timeout: 12m
          envs: GITHUB_SHA
          script_stop: true
          script: |
            set -euo pipefail
            APP=/home/ubuntu/glowupseoul_v2

            cd "$APP"
            echo "── git fetch + reset to origin/main ──"
            git fetch --prune origin main
            git reset --hard origin/main
            git log -1 --pretty='%h %s'

            echo "── server/.env from SERVER_ENV secret ──"
            cat > server/.env <<'GLOWUP_ENV_EOF'
            ${{ secrets.SERVER_ENV }}
            GLOWUP_ENV_EOF
            chmod 600 server/.env

            echo "── unpack prebuilt client dist (built on Actions runner) ──"
            if [ -f "$HOME/client-dist.tgz" ]; then
              rm -rf "$APP/client/dist_new" && mkdir -p "$APP/client/dist_new"
              tar -xzf "$HOME/client-dist.tgz" -C "$APP/client/dist_new"
              rm -rf "$APP/client/dist"
              mv "$APP/client/dist_new" "$APP/client/dist"
              rm -f "$HOME/client-dist.tgz"
              export CLIENT_PREBUILT=true
              echo "prebuilt dist installed"
            else
              export CLIENT_PREBUILT=false
            fi

            echo "── run deploy script ──"
            chmod +x deploy/deploy_fast.sh
            export CLIENT_CHANGED='${{ steps.diff.outputs.client_changed }}'
            export SERVER_CHANGED='${{ steps.diff.outputs.server_changed }}'
            export DEPLOY_CHANGED='${{ steps.diff.outputs.deploy_changed }}'
            bash -lc "CLIENT_PREBUILT=$CLIENT_PREBUILT CLIENT_CHANGED=$CLIENT_CHANGED SERVER_CHANGED=$SERVER_CHANGED DEPLOY_CHANGED=$DEPLOY_CHANGED $APP/deploy/deploy_fast.sh"
